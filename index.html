  for(const part of (r.parts||[r])){
   const q=areaRect(part),horizontal=q.w>=q.h;
   const lane=horizontal?{x:q.x,y:q.y+q.h/2-15,width:q.w,height:30}:{x:q.x+q.w/2-15,y:q.y,width:30,height:q.h};

   const rect=el('rect',{...lane,rx:8,class:`road ${isExit?'exit':''} ${isEntry?'entry':''}`},g);rect.dataset.road=r.road_key||r.name;
   if(isExit&&part===(r.parts||[r])[0]){const label=el('text',{x:q.x+q.w/2,y:q.y+q.h/2+6,'text-anchor':'middle',fill:'#fff0bd','font-size':18,'font-weight':800},g);label.textContent='SAÍDA';}
   if(blocked.has(rect.dataset.road))rect.classList.add('blocked');
  }

 }
 for(const a of LASERS)for(const part of (a.parts||[a])){const q=areaRect(part);el('rect',{x:q.x,y:q.y,width:q.w,height:q.h,rx:5,class:`laser ${a.variant?'typo':''}`},lasersG)}
 const pq=areaRect(PORTARIA);el('rect',{x:pq.x-10,y:pq.y-10,width:pq.w+20,height:pq.h+20,rx:14,fill:'#073d22',stroke:'#72ff9c','stroke-width':4},portariaG);const pt=el('text',{x:pq.x+pq.w/2,y:pq.y+pq.h/2+6,'text-anchor':'middle',fill:'#d9ffe5','font-size':17,'font-weight':'700'},portariaG);pt.textContent='CONDOMÍNIO';
 const list=[...HOUSES];if(MARKER){for(let n=173;n>=133;n--)list.push({number:n,row:MARKER.row,col:MARKER.col,special:true,slot:true})}
 for(const h of list){
  const visualRow=h.row;
  const upperLine=false;

  el('rect',{x,y,width:w,height:hh,rx:3,fill:'#152e48',stroke:'#36d7f2','stroke-width':1.5},g);
  const t=el('text',{x:x+w/2,y:y+hh/2+5,'text-anchor':'middle',fill:'#b5f3ff','font-size':Math.max(8,Math.min(16,w*.38)),'font-weight':'700'},g);

// Converte uma rua bloqueada em todas as celulas que ela ocupa.
function ranges(){const blockedCells=new Set();for(const r of ROADS)if(blocked.has(r.road_key||r.name))for(const part of (r.parts||[r]))for(let y=part.row;y<=part.row2;y++)for(let x=part.col;x<=part.col2;x++)blockedCells.add(cellName(y,x));return blockedCells}
function houseRow(h){return h.row}
function roadCell(r,c){return ROADS.some(x=>(x.parts||[x]).some(a=>r>=a.row&&r<=a.row2&&c>=a.col&&c<=a.col2))}
// ignoreBlocked=true so serve somente para calcular a alternativa visual.
function walkable(r,c,ignoreBlocked=false){if(r<0||r>=ROWS||c<0||c>=COLS||!roadCell(r,c))return false;for(const a of LASERS)for(const part of (a.parts||[a]))if(r>=part.row&&r<=part.row2&&c>=part.col&&c<=part.col2)return false;for(const h of HOUSES)if(houseRow(h)===r&&h.col===c)return false;if(ignoreBlocked)return true;return !ranges().has(cellName(r,c))}
function nearest(r,c,ignoreBlocked=false){for(let d=0;d<30;d++)for(let y=r-d;y<=r+d;y++)for(let x=c-d;x<=c+d;x++)if(Math.abs(y-r)===d||Math.abs(x-c)===d)if(walkable(y,x,ignoreBlocked))return{r:y,c:x};return null}
// A* encontra a rota respeitando ou, na alternativa, ignorando os bloqueios.
function astar(start,goal,ignoreBlocked=false){
 const dirs=[[1,0],[-1,0],[0,1],[0,-1]],stateKey=(r,c,d)=>((r*COLS+c)*5)+(d===4?0:d+1);
 const q=[{r:start.r,c:start.c,d:4,f:0}],came=new Map(),g=new Map([[stateKey(start.r,start.c,4),0]]),closed=new Set();
 while(q.length){q.sort((a,b)=>a.f-b.f);const cur=q.shift(),sk=stateKey(cur.r,cur.c,cur.d);if(closed.has(sk))continue;closed.add(sk);
  if(cur.r===goal.r&&cur.c===goal.c){const p=[];let st=sk;while(st!=null){const raw=st%5,d=raw===0?4:raw-1,cell=Math.floor(st/5),r=Math.floor(cell/COLS),c=cell%COLS;p.push({r,c});st=came.get(st)}return p.reverse()}
  for(let nd=0;nd<4;nd++){const [dr,dc]=dirs[nd],r=cur.r+dr,c=cur.c+dc;if(!walkable(r,c,ignoreBlocked))continue;const nk=stateKey(r,c,nd),turn=(cur.d!==4&&cur.d!==nd)?18:0,ng=g.get(sk)+1+turn;if(ng<(g.get(nk)??Infinity)){g.set(nk,ng);came.set(nk,sk);q.push({r,c,d:nd,f:ng+Math.abs(r-goal.r)+Math.abs(c-goal.c)})}}
 }
 return null;
}
function lanePoint(p){const road=ROADS.find(x=>(x.parts||[x]).some(a=>p.r>=a.row&&p.r<=a.row2&&p.c>=a.col&&p.c<=a.col2));const part=road?.parts?.find(a=>p.r>=a.row&&p.r<=a.row2&&p.c>=a.col&&p.c<=a.col2);if(!part)return{x:colX(p.c)+CELL_W/2,y:rowY(p.r)+CELL_H/2};const q=areaRect(part),horizontal=q.w>=q.h;return horizontal?{x:colX(p.c)+CELL_W/2,y:q.y+q.h/2}:{x:q.x+q.w/2,y:rowY(p.r)+CELL_H/2}}
function houseAccessCandidates(h,targetRow,ignoreBlocked=false){
 const front=[{r:targetRow-1,c:h.col,kind:'front'},{r:targetRow+1,c:h.col,kind:'front'}].filter(p=>p.r>=0&&p.r<ROWS&&walkable(p.r,p.c,ignoreBlocked));
 const lateral=[h.col-1,h.col+1].filter(c=>c>=0&&c<COLS).map(c=>({r:targetRow,c,kind:'lateral'})).filter(p=>walkable(p.r,p.c,ignoreBlocked));
 return [...front,...lateral];
}
// Desenha a rota. Amarela = rota normal. Laranja = alternativa que passa por bloqueio.
function renderRoute(path,n,isFallback){
 routeG.innerHTML='';const compact=[];
 for(const point of path){const prev=compact[compact.length-2],last=compact[compact.length-1];if(last&&prev&&(point.r-prev.r===prev.r-last.r)&&(point.c-prev.c===prev.c-last.c))compact[compact.length-1]=point;else compact.push(point)}
 const centers=compact.map(p=>lanePoint(p)),routeCoords=[];
 for(let i=0;i<centers.length;i++){const q=centers[i],prev=centers[i-1];if(prev&&q.x!==prev.x&&q.y!==prev.y)routeCoords.push(`${q.x},${prev.y}`);routeCoords.push(`${q.x},${q.y}`)}
 if(ENTRADA)routeCoords.unshift(`${colX(ENTRADA.col)},${rowY(ENTRADA.row)+30}`);
 const pts=routeCoords.join(' '),pathD=routeCoords.map((xy,i)=>`${i?'L':'M'} ${xy.replace(',', ' ')}`).join(' ');
 el('polyline',{points:pts,class:isFallback?'routeFallbackGlow':'routeGlow'},routeG);el('polyline',{points:pts,class:isFallback?'routeFallback':'route','marker-end':isFallback?'url(#arrowBlocked)':'url(#arrow)'},routeG);
 const firstXY=routeCoords[0].split(','),lastXY=routeCoords[routeCoords.length-1].split(','),ball=el('circle',{cx:0,cy:0,r:10,class:`routeBall ${isFallback?'fallback':''}`},routeG);el('animateMotion',{path:pathD,dur:`${Math.max(3,Math.min(14,routeCoords.length*.16))}s`,repeatCount:'indefinite',rotate:'auto'},ball);
 el('circle',{cx:firstXY[0],cy:firstXY[1],r:7,fill:'#39e58c',stroke:'#d8ffe8','stroke-width':2},routeG);el('circle',{cx:lastXY[0],cy:lastXY[1],r:6,fill:isFallback?'#ff7a00':'#ff5a5f',stroke:'#fff0f0','stroke-width':2},routeG);
 let turns=0;for(let i=2;i<path.length;i++)if(path[i].r-path[i-1].r!==path[i-1].r-path[i-2].r||path[i].c-path[i-1].c!==path[i-1].c-path[i-2].c)turns++;
 if(isFallback){statusEl.innerHTML='<span style="color:#ff7a00">Rota normal indisponível — alternativa em laranja</span>';detailsEl.textContent=`Casa ${n}: a rota livre está bloqueada. Alternativa mais próxima em laranja (${path.length-1} células, ${turns} curvas).`}
 else{statusEl.innerHTML='<span class="ok">Rota encontrada</span>';detailsEl.textContent=`ENTRADA → Casa ${n} (${path.length-1} células, ${turns} curvas)`}
}
// Primeiro tenta a rota sem passar por nenhuma rua bloqueada. Se não existir,
// calcula uma alternativa para deixar claro que será necessário passar por bloqueio.
function selectHouse(n){
 const specialH=MARKER?[...Array(41)].map((_,i)=>({number:173-i,row:MARKER.row,col:MARKER.col,special:true})):[];const h=[...HOUSES,...specialH].find(x=>x.number===n);
 if(!h){statusEl.textContent='Casa não encontrada.';return}selectedHouse=n;draw();
 const targetRow=h.special?Math.min(MARKER.row2,MARKER.row+Math.floor((173-n)*((MARKER.row2-MARKER.row+1)/41))):houseRow(h);const start={r:ENTRADA?ENTRADA.row:PORTARIA.row,c:ENTRADA?ENTRADA.col:PORTARIA.col};
 const candidates=h.special?[{r:targetRow,c:MARKER.col-1,kind:'vertical-street'}]:houseAccessCandidates(h,targetRow,false);const frontCandidates=candidates.filter(x=>x.kind==='front'||x.kind==='vertical-street');const preferred=frontCandidates.length?frontCandidates:candidates;
 let path=null;for(const goal of preferred){const trial=astar(start,goal,false);if(trial&&(!path||trial.length<path.length))path=trial}if(path){renderRoute(path,n,false);return}
 const fallbackCandidates=h.special?[{r:targetRow,c:MARKER.col-1,kind:'vertical-street'}]:houseAccessCandidates(h,targetRow,true);const fallbackFront=fallbackCandidates.filter(x=>x.kind==='front'||x.kind==='vertical-street');const fallbackPreferred=fallbackFront.length?fallbackFront:fallbackCandidates;
 let fallback=null;for(const goal of fallbackPreferred){const trial=astar(start,goal,true);if(trial&&(!fallback||trial.length<fallback.length))fallback=trial}if(fallback){renderRoute(fallback,n,true);return}
 routeG.innerHTML='';statusEl.textContent='Nenhuma rota disponível.';detailsEl.textContent=`Casa ${n}: não foi encontrada uma rota, nem mesmo pela alternativa mais próxima.`;
}
async function loadRemoteBlocks(){
 if(!sb)return;
 const {data,error}=await sb.from('blocked_roads').select('road_key,road_name').eq('blocked',true);
 if(error)return;
 blocked=new Set((data||[]).map(canonicalRoadKey).filter(Boolean));draw();
 if(selectedHouse!==null)selectHouse(selectedHouse);
}
async function toggleRoad(r){
 if(!window.adminUnlocked){alert('Acesse Administração e faça login primeiro.');return}
 const k=r.road_key||r.name,nowBlocked=!blocked.has(k);
 if(sb){let result;
  if(nowBlocked){const existing=await sb.from('blocked_roads').select('road_key').eq('road_key',k).limit(1);if(existing.error){alert('Não foi possível verificar a rua: '+existing.error.message);return}if(existing.data?.length)result=await sb.from('blocked_roads').update({road_name:r.name,blocked:true,updated_by:currentUser.id,updated_at:new Date().toISOString()}).eq('road_key',k);else result=await sb.from('blocked_roads').insert({road_key:k,road_name:r.name,blocked:true,updated_by:currentUser.id,updated_at:new Date().toISOString()});}
  else{result=await sb.from('blocked_roads').delete().eq('road_key',k);if(result.error)result=await sb.from('blocked_roads').delete().eq('road_name',r.name)}
  if(result.error){alert('Não foi possível salvar o bloqueio: '+result.error.message);return}
 }
 nowBlocked?blocked.add(k):blocked.delete(k);if(!sb)localStorage.setItem('condominio_bloqueios',JSON.stringify([...blocked]));draw();
}
function updateBlocked(){blockedList.innerHTML=blocked.size?[...blocked].map(k=>{const r=ROADS.find(x=>(x.road_key||x.name)===k);const action=window.adminUnlocked?`<button class="secondary" onclick="removeBlocked('${k}')">Liberar</button>`:'';return `<div class="row"><span>${r?.name||k}</span>${action}</div>`}).join(''):'Nenhuma rua bloqueada.'}
async function removeBlocked(k){if(!window.adminUnlocked){alert('Acesse Administração e faça login primeiro.');return}const r=ROADS.find(x=>(x.road_key||x.name)===k);if(sb){let result=await sb.from('blocked_roads').delete().eq('road_key',k);if(result.error&&r)result=await sb.from('blocked_roads').delete().eq('road_name',r.name);if(result.error){alert(result.error.message);return}}blocked.delete(k);if(!sb)localStorage.setItem('condominio_bloqueios',JSON.stringify([...blocked]));draw();}
window.adminUnlocked=false;document.querySelector('#admin').onclick=async()=>{if(sb){const email=prompt('E-mail do administrador:');const password=prompt('Senha do Supabase:');if(!email||!password)return;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){alert('Login recusado: '+error.message);return}currentUser=data.user;const {data:profile,error:profileError}=await sb.from('profiles').select('is_admin').eq('id',currentUser.id).single();if(profileError||!profile?.is_admin){await sb.auth.signOut();alert('Usuário sem permissão de administração.');return}window.adminUnlocked=true;await loadRemoteBlocks();alert('Modo administrativo ativado.')}else{const p=prompt('Senha administrativa:');if(!p)return;const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));const h=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');if(h===ADMIN_HASH){window.adminUnlocked=true;draw();alert('Modo administrativo ativado. Clique nas ruas para bloquear/liberar.')}else alert('Senha incorreta.')}};
document.querySelector('#go').onclick=()=>selectHouse(Number(document.querySelector('#search').value));document.querySelector('#search').onkeydown=e=>{if(e.key==='Enter')selectHouse(Number(e.target.value))};document.querySelector('#clear').onclick=()=>{routeG.innerHTML='';selectedHouse=null;draw();statusEl.textContent='Aguardando destino.';detailsEl.textContent='Nenhuma rota calculada.'};
let v={x:0,y:0,k:1},drag=false,last=null;function apply(){view.setAttribute('transform',`translate(${v.x} ${v.y}) scale(${v.k})`)}svg.onwheel=e=>{e.preventDefault();v.k=Math.max(.2,Math.min(6,v.k*(e.deltaY<0?1.15:.87)));apply()};svg.onpointerdown=e=>{drag=true;last=e;svg.classList.add('drag')};svg.onpointermove=e=>{if(!drag)return;v.x+=(e.clientX-last.clientX)*2;v.y+=(e.clientY-last.clientY)*2;last=e;apply()};svg.onpointerup=svg.onpointerleave=()=>{drag=false;svg.classList.remove('drag')};
loadRemoteBlocks();setInterval(loadRemoteBlocks,5000);draw();
